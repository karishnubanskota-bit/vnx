name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  GRADLE_VERSION: 8.10.2
  APK_NAME: VNX-Apex.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: toolchain
        run: |
          set -euxo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/ct.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o /tmp/ct.zip -d /tmp/ct
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          curl -sSL -o /tmp/g.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q -o /tmp/g.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          test -x "$HOME/gradle-${GRADLE_VERSION}/bin/gradle"

      - name: keystore
        run: |
          set -euxo pipefail
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: write-sources
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/ai/venice/vnx app/src/main/cpp \
                   app/src/main/res/drawable app/src/main/res/values \
                   app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-anydpi-v26 \
                   app/src/main/assets out
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VNX"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          -keep class rikka.shizuku.** { *; }
          -keep class moe.shizuku.** { *; }
          -dontwarn rikka.shizuku.**
          -dontwarn moe.shizuku.**
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ai.venice.vnx"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ai.venice.vnx"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 9
                  versionName = "1.8"
              }

              buildTypes {
                  getByName("debug") { isMinifyEnabled = false }
                  getByName("release") {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_17) } }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23"/>

              <queries>
                  <package android:name="moe.shizuku.privileged.api"/>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.dts.freefiremax"/>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="VNX Apex"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlaySvc"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="game overlay and memory helper"/>
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0B0E13</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#39FF88" android:pathData="M54,22a32,32 0 1,0 0,64a32,32 0 1,0 0,-64z"/>
              <path android:fillColor="#0B0E13" android:pathData="M54,31a23,23 0 1,0 0,46a23,23 0 1,0 0,-46z"/>
              <path android:fillColor="#39FF88" android:pathData="M51,10h6v32h-6z M51,66h6v32h-6z M10,51h32v6h-32z M66,51h32v6h-32z"/>
              <path android:fillColor="#FF3D71" android:pathData="M51,51h6v6h-6z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B0E13" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#39FF88" android:pathData="M54,22a32,32 0 1,0 0,64a32,32 0 1,0 0,-64z"/>
              <path android:fillColor="#0B0E13" android:pathData="M54,31a23,23 0 1,0 0,46a23,23 0 1,0 0,-46z"/>
              <path android:fillColor="#39FF88" android:pathData="M51,10h6v32h-6z M51,66h6v32h-6z M10,51h32v6h-32z M66,51h32v6h-32z"/>
              <path android:fillColor="#FF3D71" android:pathData="M51,51h6v6h-6z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/ai/venice/vnx/ShizukuGate.kt <<'EOF'
          package ai.venice.vnx

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku

          object ShizukuGate {
              private const val REQ = 1337
              fun alive(): Boolean = runCatching { Shizuku.pingBinder() }.getOrDefault(false)
              fun installed(): Boolean = runCatching { Shizuku.getVersion() > 0 }.getOrDefault(false)
              fun granted(): Boolean = runCatching {
                  alive() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              }.getOrDefault(false)
              fun request() {
                  runCatching {
                      if (!alive()) return@runCatching
                      if (granted()) return@runCatching
                      Shizuku.requestPermission(REQ)
                  }
              }
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/Shell.kt <<'EOF'
          package ai.venice.vnx

          import rikka.shizuku.Shizuku

          object Shell {
              private const val MARK = "__VNX_MARK__"
              private val lock = Any()
              private var proc: Process? = null

              private val newProcess by lazy {
                  runCatching {
                      Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      ).apply { isAccessible = true }
                  }.getOrNull()
              }

              fun spawn(cmd: Array<String>): Process? =
                  runCatching {
                      newProcess?.invoke(null, *arrayOf<Any?>(cmd, null, null)) as? Process
                  }.getOrNull()

              fun alive(p: Process): Boolean =
                  try { p.exitValue(); false } catch (e: IllegalThreadStateException) { true }

              private fun warm(): Process? {
                  proc?.let { if (alive(it)) return it }
                  proc = null
                  if (!ShizukuGate.granted()) return null
                  val p = spawn(arrayOf("sh")) ?: return null
                  proc = p
                  runCatching {
                      p.outputStream.write("echo ready\n".toByteArray())
                      p.outputStream.flush()
                      val buf = ByteArray(256)
                      val end = System.currentTimeMillis() + 800L
                      while (System.currentTimeMillis() < end) {
                          if (p.inputStream.available() > 0) { p.inputStream.read(buf); break }
                          Thread.sleep(5)
                      }
                  }
                  return p
              }

              private fun drop() { runCatching { proc?.destroy() }; proc = null }

              fun exec(cmd: String, timeoutMs: Long = 90_000L): String = synchronized(lock) {
                  val p = warm() ?: return@synchronized "! shizuku not available"
                  try {
                      p.outputStream.write("$cmd 2>&1; echo $MARK\n".toByteArray())
                      p.outputStream.flush()
                  } catch (e: Exception) {
                      drop(); return@synchronized "! shell write failed: ${e.message}"
                  }
                  val sb = StringBuilder()
                  val buf = ByteArray(8192)
                  val end = System.currentTimeMillis() + timeoutMs
                  while (true) {
                      try {
                          if (p.inputStream.available() > 0) {
                              val n = p.inputStream.read(buf)
                              if (n <= 0) { drop(); return@synchronized "! shell closed" }
                              sb.append(String(buf, 0, n))
                              val i = sb.indexOf(MARK)
                              if (i >= 0) return@synchronized sb.substring(0, i).trim()
                          } else {
                              if (!alive(p)) {
                                  drop()
                                  val s = sb.toString().trim()
                                  return@synchronized if (s.isEmpty()) "! shell closed" else s
                              }
                              if (System.currentTimeMillis() > end)
                                  return@synchronized "! timeout ${timeoutMs}ms"
                              Thread.sleep(5)
                          }
                      } catch (e: Exception) {
                          drop(); return@synchronized "! shell read failed: ${e.message}"
                      }
                  }
                  ""
              }
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/Auth.kt <<'EOF'
          package ai.venice.vnx

          import android.content.Context
          import java.security.MessageDigest

          object Auth {
              private const val SALT = "vnx-apex-9f3a"
              const val DEFAULT_USER = "venice"
              const val DEFAULT_PASS = "venice"

              private fun p(c: Context) = c.getSharedPreferences("vnx", Context.MODE_PRIVATE)

              private fun h(s: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest((SALT + s).toByteArray())
                      .joinToString("") { "%02x".format(it.toInt() and 0xFF) }

              fun seed(c: Context) {
                  val sp = p(c)
                  if (!sp.contains("u")) sp.edit()
                      .putString("u", DEFAULT_USER).putString("h", h(DEFAULT_PASS)).apply()
              }

              fun verify(c: Context, user: String, pass: String): Boolean {
                  seed(c)
                  val sp = p(c)
                  return sp.getString("u", "") == user.trim() && sp.getString("h", "") == h(pass)
              }

              fun loggedIn(c: Context) = p(c).getBoolean("in", false)
              fun login(c: Context) { p(c).edit().putBoolean("in", true).apply() }
              fun logout(c: Context) { p(c).edit().putBoolean("in", false).apply() }
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/Native.kt <<'EOF'
          package ai.venice.vnx

          import android.content.Context
          import android.os.Build

          object Native {
              const val DIR = "/data/local/tmp/vnx"
              const val BIN = "$DIR/vnxmem"
              private val installed = HashSet<String>()

              private fun abi(ctx: Context): String? =
                  Build.SUPPORTED_ABIS.firstOrNull { a ->
                      runCatching { ctx.assets.open("vnxmem-$a").close(); true }.getOrDefault(false)
                  }

              fun install(ctx: Context): String {
                  val a = abi(ctx) ?: return "! no helper for ${Build.SUPPORTED_ABIS.joinToString()}"
                  synchronized(installed) {
                      if (installed.contains(a)) return "helper already installed ($a)"
                      val bytes = ctx.assets.open("vnxmem-$a").use { it.readBytes() }
                      val script = "mkdir -p $DIR; cat > $BIN; chmod 755 $BIN; " +
                          "test \"\$(stat -c%s $BIN)\" = \"${bytes.size}\" && test -x $BIN && echo OK"
                      val p = Shell.spawn(arrayOf("sh", "-c", script)) ?: return "! cannot spawn sh"
                      try { p.outputStream.use { it.write(bytes) } }
                      catch (e: Exception) { return "! write failed: ${e.message}" }
                      val out = p.inputStream.readBytes().toString(Charsets.UTF_8).trim()
                      val code = p.waitFor()
                      if (code != 0 || !out.contains("OK"))
                          return "! install failed exit=$code out=$out want=${bytes.size}b"
                      installed.add(a)
                      return "helper installed ($a, ${bytes.size} bytes)"
                  }
              }

              private fun digits(s: String) = s.isNotEmpty() && s.all { it.isDigit() }

              fun pid(): String {
                  for (pkg in listOf("com.dts.freefireth", "com.dts.freefiremax")) {
                      val d = Shell.exec("pidof $pkg").trim().split(" ").firstOrNull().orEmpty().trim()
                      if (digits(d)) return d
                      val ps = Shell.exec("ps -A -o PID,ARGS 2>/dev/null")
                      val l = ps.lines().firstOrNull { it.trim().endsWith(" $pkg") }
                      val v = l?.trim()?.split(" ")?.firstOrNull().orEmpty()
                      if (digits(v)) return v
                  }
                  return ""
              }

              private fun need(pid: String) = if (pid.isBlank()) "! no pid" else null

              fun probe(pid: String) = need(pid) ?: Shell.exec("$BIN probe $pid")
              fun mods(pid: String) = need(pid) ?: Shell.exec("$BIN mods $pid")
              fun tracer(pid: String) = need(pid) ?: Shell.exec("$BIN tracerpid $pid")
              fun read(pid: String, a: String, n: String) = need(pid) ?: Shell.exec("$BIN read $pid $a $n")
              fun write(pid: String, a: String, hx: String) = need(pid) ?: Shell.exec("$BIN write $pid $a $hx")
              fun findm(pid: String, m: String, t: String, p: String) =
                  need(pid) ?: Shell.exec("$BIN findm $pid $m $t '$p'", 240_000L)
              fun fnew(pid: String, m: String, t: String, v: String) =
                  need(pid) ?: Shell.exec("$BIN fnew $pid $m $t $v", 240_000L)
              fun fnext(pid: String, t: String, v: String) = need(pid) ?: Shell.exec("$BIN fnext $pid $t $v")
              fun frange(pid: String, t: String, lo: String, hi: String) =
                  need(pid) ?: Shell.exec("$BIN frange $pid $t $lo $hi")
              fun fshow(pid: String, n: String) = need(pid) ?: Shell.exec("$BIN fshow $pid $n")
              fun fset(pid: String, i: String, t: String, v: String) =
                  need(pid) ?: Shell.exec("$BIN fset $pid $i $t $v")
              fun fsnap(pid: String) = need(pid) ?: Shell.exec("$BIN fsnap $pid")
              fun frestore(pid: String) = need(pid) ?: Shell.exec("$BIN frestore $pid")
              fun freset() = Shell.exec("$BIN freset")

              fun aim(pid: String, cam: String, me: String, arr: String, count: String,
                      stride: String, posoff: String, smooth: String, fov: String,
                      mode: String, flags: String): String {
                  if (pid.isBlank()) return "! no pid"
                  val cmd = "$BIN aim $pid $cam $me $arr $count $stride $posoff $smooth $fov $mode $flags"
                  Shell.exec("( $cmd ) > $DIR/aim.log 2>&1 < /dev/null & echo started")
                  return "aim running -> $DIR/aim.log"
              }

              fun aimStop(): String {
                  Shell.exec("pkill -f '$BIN aim' 2>/dev/null || true")
                  return "aim stopped"
              }

              fun aimLog() = Shell.exec("tail -n 25 $DIR/aim.log 2>/dev/null || echo '(no log yet)'")

              fun selfTest(ctx: Context, pid: String): String {
                  val sb = StringBuilder()
                  var pass = 0; var fail = 0
                  fun step(n: String, ok: Boolean, d: String) {
                      if (ok) pass++ else fail++
                      sb.append(if (ok) "[PASS] " else "[FAIL] ").append(n)
                      if (d.isNotEmpty()) sb.append(" :: ").append(d.take(110))
                      sb.append('\n')
                  }
                  val inst = install(ctx)
                  step("01 install helper", inst.startsWith("helper"), inst)
                  if (pid.isBlank()) {
                      step("02 game pid", false, "Free Fire not running")
                      return sb.append('\n').append(pass).append(" pass / ").append(fail).append(" fail").toString()
                  }
                  step("02 game pid", true, pid)
                  val pr = Shell.exec("$BIN probe $pid")
                  step("03 memory access", pr.contains("RESULT: OK"),
                       pr.lines().firstOrNull { it.startsWith("RESULT") } ?: pr.take(80))
                  val tp = Shell.exec("$BIN tracerpid $pid").trim()
                  step("04 tracerpid readable", tp.startsWith("tracerpid"), tp)
                  val md = Shell.exec("$BIN mods $pid")
                  val mc = md.lines().count { it.isNotBlank() && !it.startsWith("!") }
                  step("05 list modules", mc > 3, "$mc modules")
                  val fm = md.lines().firstOrNull()?.trim()?.split(" ")?.firstOrNull().orEmpty()
                  if (fm.isNotEmpty()) {
                      val rd = Shell.exec("$BIN read $pid 0x$fm 32")
                      val hx = rd.lines().lastOrNull().orEmpty().trim()
                      step("06 read memory", hx.length >= 32 && hx.all { it in "0123456789abcdefABCDEF" },
                           "${hx.length} hex chars")
                  } else step("06 read memory", false, "no module base")
                  val f1 = Shell.exec("$BIN fnew $pid libil2cpp.so f 1.0", 240_000L)
                  val n1 = Regex("set (\\d+)").find(f1)?.groupValues?.get(1)?.toIntOrNull() ?: -1
                  step("07 first scan", n1 > 0, "candidates=$n1")
                  if (n1 > 0) {
                      val f2 = Shell.exec("$BIN fnext $pid f 1.0")
                      val n2 = Regex("remaining (\\d+)").find(f2)?.groupValues?.get(1)?.toIntOrNull() ?: -1
                      step("08 narrow", n2 in 1..n1, "remaining=$n2")
                      val fs = Shell.exec("$BIN fshow $pid 3")
                      step("09 show hits", fs.contains("count "), fs.lines().lastOrNull().orEmpty())
                      step("10 snapshot", Shell.exec("$BIN fsnap $pid").contains("snapshot saved"), "ok")
                      step("11 restore write", Shell.exec("$BIN frestore $pid").contains("restored"), "ok")
                  } else {
                      step("08 narrow", false, "no candidates")
                      step("09 show hits", false, "skipped")
                      step("10 snapshot", false, "skipped")
                      step("11 restore write", false, "skipped")
                  }
                  Shell.exec("$BIN freset")
                  step("12 filter reset", true, "cleared")
                  return sb.append('\n').append(pass).append(" pass / ").append(fail).append(" fail").toString()
              }
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/OverlaySvc.kt <<'EOF'
          package ai.venice.vnx

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class OverlaySvc : Service() {
              companion object {
                  @Volatile var running = false
                  @Volatile var status = "VNX APEX"
                  private const val CH = "vnx"
              }

              private var wm: WindowManager? = null
              private var hud: TextView? = null
              private var orb: TextView? = null
              private val ui = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() { hud?.text = status; ui.postDelayed(this, 1000L) }
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  running = true
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CH, "VNX", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, CH)
                      .setContentTitle("VNX Apex")
                      .setContentText("overlay active")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else
                      startForeground(1, n)
                  mount()
                  ui.post(tick)
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun mount() {
                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  val h = TextView(this).apply {
                      text = status
                      setTextColor(Color.parseColor("#39FF88"))
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setBackgroundColor(Color.parseColor("#99000000"))
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }
                  val o = TextView(this).apply {
                      text = "VNX"
                      setTextColor(Color.parseColor("#39FF88"))
                      textSize = 10f
                      typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#66000000"))
                  }
                  hud = h; orb = o
                  val hp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      flags, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = dp(12); y = dp(60) }
                  val op = WindowManager.LayoutParams(
                      dp(72), dp(72),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      flags, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.END; x = dp(12); y = dp(60) }
                  runCatching { w.addView(h, hp) }
                  runCatching { w.addView(o, op) }
              }

              override fun onDestroy() {
                  running = false
                  ui.removeCallbacks(tick)
                  val w = wm; val h = hud; val o = orb
                  if (w != null && h != null) runCatching { w.removeView(h) }
                  if (w != null && o != null) runCatching { w.removeView(o) }
                  super.onDestroy()
              }
          }
