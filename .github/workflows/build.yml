name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Manual SDK & NDK Environment Fallback
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
            export ANDROID_HOME=$HOME/Android/Sdk
          fi
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          wget -q https://google.com -O cmdline.zip
          unzip -q cmdline.zip -d /tmp
          mv /tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK Components & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Set up Gradle Engine
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Scaffold Project Source Files
        run: |
          mkdir -p app/src/main/java/ai/venice/vnx/core
          mkdir -p app/src/main/java/ai/venice/vnx/native
          mkdir -p app/src/main/java/ai/venice/vnx/re
          mkdir -p app/src/main/java/ai/venice/vnx/read
          mkdir -p app/src/main/java/ai/venice/vnx/overlay
          mkdir -p app/src/main/java/ai/venice/vnx/antiflag
          mkdir -p app/src/main/cpp app/src/main/assets app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VNX"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3072m
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "ai.venice.vnx"
              compileSdk = 35
              defaultConfig {
                  applicationId = "ai.venice.vnx"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64") }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt") } }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <package android:name="moe.shizuku.privileged.api"/>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.dts.freefiremax"/>
              </queries>
              <application android:label="@string/app_name" android:theme="@style/Theme.VNX">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".overlay.OverlaySvc"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                                android:value="game overlay panel"/>
                  </service>
                  <provider android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">VNX Apex</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.VNX" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#060709</item>
                  <item name="android:statusBarColor">#060709</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(vnxmem C)
          add_executable(vnxmem vnxmem.c)
          target_compile_options(vnxmem PRIVATE -O2 -static -Wall)
          EOF

          cat > app/src/main/cpp/vnxmem.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <errno.h>
          #include <math.h>
          #include <sys/types.h>

          #define CHUNK (1 << 20)
          static pid_t g_pid = 0;
          static int g_fd = -1;

          static int mem_open(pid_t pid) {
              char p[64];
              snprintf(p, sizeof(p), "/proc/%d/mem", pid);
              g_fd = open(p, O_RDWR);
              if (g_fd < 0) return -1;
              g_pid = pid; return 0;
          }
          static int rd(unsigned long a, void *b, size_t n) {
              return pread(g_fd, b, n, (off_t)a) == (ssize_t)n ? 0 : -1;
          }
          int main() { printf("VNX Subsystem Initialized\n"); return 0; }
          EOF

          cat > app/src/main/java/ai/venice/vnx/core/Shell.kt <<'EOF'
          package ai.venice.vnx.core
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.BufferedWriter
          object Shell {
              private var proc: Process? = null
              private var out: BufferedWriter? = null
              private var reader: BufferedReader? = null
              fun warm() {
                  val p = Shizuku.newProcess(arrayOf("sh"), null, null)
                  proc = p
                  out = p.outputStream.bufferedWriter()
                  reader = p.inputStream.bufferedReader()
              }
              fun exec(cmd: String): String { return "ready" }
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/core/ShizukuGate.kt <<'EOF'
          package ai.venice.vnx.core
          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          object ShizukuGate {
              fun granted(): Boolean = true
              fun request() {}
              fun arm() {}
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/core/Auth.kt <<'EOF'
          package ai.venice.vnx.core
          import android.content.Context
          object Auth {
              fun seed(c: Context) {}
              fun verify(c: Context, u: String, p: String): Boolean = true
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/native/Native.kt <<'EOF'
          package ai.venice.vnx.native
          import android.content.Context
          object Native {
              fun install(ctx: Context, abi: String) {}
              fun tracer(pid: Int): String = "0"
          }
          EOF

          cat > app/src/main/java/ai/venice/vnx/antiflag/ReportCleaner.kt <<'EOF'
Use code with caution.
package ai.venice.vnx.antiflag
object ReportCleaner {
fun run(): List = listOf("clean")
}
EOF
cat > app/src/main/java/ai/venice/vnx/overlay/OverlaySvc.kt <<'EOF'
package ai.venice.vnx.overlay
import android.app.Service
import android.content.Intent
import android.os.IBinder
class OverlaySvc : Service() {
override fun onBind(i: Intent?): IBinder? = null
}
EOF
cat > app/src/main/java/ai/venice/vnx/MainActivity.kt <<'EOF'
package ai.venice.vnx
import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.material3.Text
class MainActivity : ComponentActivity() {
override fun onCreate(savedInstanceState: Bundle?) {
super.onCreate(savedInstanceState)
setContent { Text("VNX Subsystem Core Active") }
}
}
EOF
- name: Build Native Helpers (3 ABIs)
run: |
NDK="$ANDROID_HOME/ndk/26.1.10909125"
OUT=app/src/main/assets
mkdir -p "$OUT"
"$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" -O2 -static -o "$OUT/vnxmem-arm64-v8a" app/src/main/cpp/vnxmem.c
"$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" -O2 -static -o "$OUT/vnxmem-armeabi-v7a" app/src/main/cpp/vnxmem.c
"$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" -O2 -static -o "$OUT/vnxmem-x86_64" app/src/main/cpp/vnxmem.c
- name: Compile Application APK
run: gradle assembleDebug --no-daemon --stacktrace
- name: Upload APK Package Artifact
uses: actions/upload-artifact@v4
with:
name: vnx-apk
path: app/build/outputs/apk/debug/*.apk
