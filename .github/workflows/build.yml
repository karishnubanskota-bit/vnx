          cat > app/src/main/cpp/vnxmem.c <<'VNXC'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>
          #include <ctype.h>
          #include <math.h>
          #include <time.h>
          #include <signal.h>
          #include <sys/uio.h>
          #include <sys/types.h>

          #define VERSION "1.0"
          #define CHUNK   (1u << 20)
          #define MAXMAPS 8192
          #define MAXMODS 512
          #define MAXF    400000
          #define MAXPAT  256
          #define SCAN_CAP (640ull << 20)
          #define RAD2DEG (180.0 / 3.14159265358979323846)

          static pid_t g_pid = 0;
          static int   g_memfd = -1;
          static int   g_vm_ok = 0;
          static int   g_ptr = 8;

          typedef struct { uint64_t s, e; char perms[5]; char name[256]; } Map;
          static Map g_maps[MAXMAPS];
          static int g_nmaps = 0;

          typedef struct { char name[256]; uint64_t s, e; } Mod;
          static Mod g_mods[MAXMODS];
          static int g_nmods = 0;

          static uint64_t g_f[MAXF];
          static size_t   g_fn = 0;
          static uint8_t  g_fsnap[MAXF][8];
          static size_t   g_fsnapn = 0;
          static char     g_ftype = 'f';

          static void die(const char *m) { fprintf(stderr, "! %s\n", m); exit(1); }

          static size_t tsize(char t) {
              switch (t) {
                  case 'b': return 1;
                  case 'w': return 2;
                  case 'f': return 4;
                  case 'd': return 8;
                  case 'h': return 2;
                  case 'x': return 4;
                  default:  return 4;
              }
          }
          static int valid_type(char t) {
              return t=='b'||t=='w'||t=='f'||t=='d'||t=='h'||t=='x';
          }

          static ssize_t mem_read(uint64_t addr, void *buf, size_t n) {
              if (g_vm_ok) {
                  struct iovec lo; struct iovec re;
                  lo.iov_base = buf; lo.iov_len = n;
                  re.iov_base = (void *)(uintptr_t)addr; re.iov_len = n;
                  ssize_t r = process_vm_readv(g_pid, &lo, 1, &re, 1, 0);
                  if (r > 0) return r;
              }
              if (g_memfd >= 0) return pread(g_memfd, buf, n, (off_t)addr);
              return -1;
          }

          static ssize_t mem_write(uint64_t addr, const void *buf, size_t n) {
              if (g_vm_ok) {
                  struct iovec lo; struct iovec re;
                  lo.iov_base = (void *)buf; lo.iov_len = n;
                  re.iov_base = (void *)(uintptr_t)addr; re.iov_len = n;
                  ssize_t r = process_vm_writev(g_pid, &lo, 1, &re, 1, 0);
                  if (r > 0) return r;
              }
              if (g_memfd >= 0) return pwrite(g_memfd, buf, n, (off_t)addr);
              return -1;
          }

          static int read_ptr(uint64_t addr, uint64_t *out) {
              uint8_t b[8];
              uint64_t v = 0;
              int i;
              memset(b, 0, sizeof b);
              if (mem_read(addr, b, (size_t)g_ptr) != (ssize_t)g_ptr) return 0;
              for (i = g_ptr - 1; i >= 0; --i) v = (v << 8) | b[i];
              *out = v;
              return 1;
          }

          static int read_vec3(uint64_t addr, float *x, float *y, float *z) {
              float v[3];
              if (mem_read(addr, v, sizeof v) != (ssize_t)sizeof v) return 0;
              *x = v[0]; *y = v[1]; *z = v[2];
              return 1;
          }

          static int load_maps(pid_t pid) {
              char path[64];
              char line[1024];
              FILE *f;
              snprintf(path, sizeof path, "/proc/%d/maps", pid);
              f = fopen(path, "r");
              if (!f) return 0;
              g_nmaps = 0; g_nmods = 0;
              while (fgets(line, sizeof line, f) && g_nmaps < MAXMAPS) {
                  unsigned long long a = 0, b = 0;
                  char perms[8];
                  char *p;
                  Map *m;
                  memset(perms, 0, sizeof perms);
                  if (sscanf(line, "%llx-%llx %7s", &a, &b, perms) != 3) continue;
                  m = &g_maps[g_nmaps++];
                  m->s = (uint64_t)a; m->e = (uint64_t)b;
                  memcpy(m->perms, perms, 4); m->perms[4] = 0;
                  m->name[0] = 0;
                  p = strchr(line, '/');
                  if (p) {
                      size_t n = strlen(p);
                      if (n && p[n-1] == '\n') p[--n] = 0;
                      if (n >= sizeof m->name) n = sizeof m->name - 1;
                      memcpy(m->name, p, n); m->name[n] = 0;
                      {
                          int found = -1;
                          int i;
                          for (i = 0; i < g_nmods; ++i)
                              if (!strcmp(g_mods[i].name, m->name)) { found = i; break; }
                          if (found >= 0) {
                              if (m->s < g_mods[found].s) g_mods[found].s = m->s;
                              if (m->e > g_mods[found].e) g_mods[found].e = m->e;
                          } else if (g_nmods < MAXMODS) {
                              Mod *md = &g_mods[g_nmods++];
                              snprintf(md->name, sizeof md->name, "%s", m->name);
                              md->s = m->s; md->e = m->e;
                          }
                      }
                  }
              }
              fclose(f);
              return g_nmaps > 0;
          }

          static Mod *find_mod(const char *name) {
              int i;
              for (i = 0; i < g_nmods; ++i)
                  if (!strcmp(g_mods[i].name, name)) return &g_mods[i];
              for (i = 0; i < g_nmods; ++i) {
                  size_t ln = strlen(name), lm = strlen(g_mods[i].name);
                  if (ln <= lm && !strcmp(g_mods[i].name + (lm - ln), name)) return &g_mods[i];
              }
              return NULL;
          }

          static int open_target(pid_t pid) {
              char p[64];
              uint64_t probe = 0;
              uint8_t b[16];
              int i;
              g_pid = pid; g_ptr = 8;
              snprintf(p, sizeof p, "/proc/%d/mem", pid);
              g_memfd = open(p, O_RDWR);
              if (g_memfd < 0) g_memfd = open(p, O_RDONLY);
              if (!load_maps(pid)) { fprintf(stderr, "! cannot read maps\n"); return 0; }
              for (i = 0; i < g_nmaps; ++i)
                  if (g_maps[i].perms[0] == 'r') { probe = g_maps[i].s; break; }
              if (!probe) { fprintf(stderr, "! no readable mapping\n"); return 0; }
              if (mem_read(probe, b, sizeof b) == (ssize_t)sizeof b) g_vm_ok = 1;
              else if (g_memfd >= 0 && pread(g_memfd, b, sizeof b, (off_t)probe) == (ssize_t)sizeof b) g_vm_ok = 0;
              else { fprintf(stderr, "! cannot read target memory errno=%d\n", errno); return 0; }
              return 1;
          }

          static double bytes_to_d(const uint8_t *b, char t) {
              switch (t) {
                  case 'b': return (double)(int8_t)b[0];
                  case 'w': { int16_t v; memcpy(&v, b, 2); return v; }
                  case 'h': { uint16_t v; memcpy(&v, b, 2); return v; }
                  case 'f': { float v; memcpy(&v, b, 4); return v; }
                  case 'd': { double v; memcpy(&v, b, 8); return v; }
                  case 'x': { int32_t v; memcpy(&v, b, 4); return v; }
              }
              return 0;
          }

          static void d_to_bytes(double d, char t, uint8_t *b) {
              memset(b, 0, 8);
              switch (t) {
                  case 'b': { int8_t v = (int8_t)d; memcpy(b, &v, 1); break; }
                  case 'w': { int16_t v = (int16_t)d; memcpy(b, &v, 2); break; }
                  case 'h': { uint16_t v = (uint16_t)d; memcpy(b, &v, 2); break; }
                  case 'f': { float v = (float)d; memcpy(b, &v, 4); break; }
                  case 'd': { double v = d; memcpy(b, &v, 8); break; }
                  case 'x': { int32_t v = (int32_t)d; memcpy(b, &v, 4); break; }
              }
          }

          static int eq_value(const uint8_t *b, char t, double want) {
              switch (t) {
                  case 'f': { float a; memcpy(&a, b, 4); return fabsf(a - (float)want) <= 1e-6f; }
                  case 'd': { double a; memcpy(&a, b, 8); return fabs(a - want) <= 1e-9; }
                  default:  return bytes_to_d(b, t) == want;
              }
          }

          static int cmd_help(void) {
              printf("vnxmem %s\n", VERSION);
              printf("usage: vnxmem <cmd> <pid> [args]\n");
              printf("  probe tracerpid mods read write findm\n");
              printf("  fnew fnext frange fshow fset fsnap frestore freset\n");
              printf("  aim <pid> <cam> <me> <arr> <count> <stride> <posoff> <smooth> <fov> <mode> <flags>\n");
              printf("  types b w h x f d | mode e|q | flags 1 assist 2 pitch 4 invert 8 zup\n");
              return 0;
          }

          static int cmd_probe(pid_t pid) {
              uint64_t probe = 0;
              uint8_t b[32];
              int i;
              if (!open_target(pid)) { printf("RESULT: FAIL open\n"); return 1; }
              for (i = 0; i < g_nmaps; ++i)
                  if (g_maps[i].perms[0] == 'r') { probe = g_maps[i].s; break; }
              if (mem_read(probe, b, sizeof b) == (ssize_t)sizeof b) {
                  printf("RESULT: OK backend=%s ptr=%d addr=0x%llx\n",
                         g_vm_ok ? "process_vm_readv" : "procpidmem", g_ptr,
                         (unsigned long long)probe);
                  return 0;
              }
              printf("RESULT: FAIL read errno=%d\n", errno);
              return 1;
          }

          static int cmd_tracerpid(pid_t pid) {
              char p[64], buf[64];
              FILE *f;
              snprintf(p, sizeof p, "/proc/%d/status", pid);
              f = fopen(p, "r");
              if (!f) { printf("tracerpid %d -1\n", pid); return 1; }
              while (fgets(buf, sizeof buf, f)) {
                  if (!strncmp(buf, "TracerPid:", 10)) {
                      printf("tracerpid %d %ld\n", pid, strtol(buf + 10, NULL, 10));
                      fclose(f); return 0;
                  }
              }
              fclose(f);
              printf("tracerpid %d 0\n", pid);
              return 0;
          }

          static int cmd_mods(pid_t pid) {
              int i;
              if (!open_target(pid)) return 1;
              for (i = 0; i < g_nmods; ++i)
                  printf("%llx %s\n", (unsigned long long)g_mods[i].s, g_mods[i].name);
              return 0;
          }

          static int cmd_read(pid_t pid, uint64_t addr, size_t len) {
              uint8_t *buf;
              ssize_t r;
              ssize_t i;
              if (!open_target(pid)) return 1;
              if (!len) len = 64;
              if (len > 4096) len = 4096;
              buf = malloc(len);
              if (!buf) die("oom");
              r = mem_read(addr, buf, len);
              if (r <= 0) { printf("! read failed errno=%d\n", errno); free(buf); return 1; }
              printf("read 0x%llx %zd bytes\n", (unsigned long long)addr, r);
              for (i = 0; i < r; ++i) printf("%02x", buf[i]);
              printf("\n");
              free(buf);
              return 0;
          }

          static int parse_hexbytes(const char *s, uint8_t *out, size_t max) {
              size_t n = 0;
              while (*s && n < max) {
                  char t[3];
                  while (*s == ' ' || *s == ',') ++s;
                  if (!isxdigit((unsigned char)*s)) break;
                  t[0] = *s; t[1] = 0; t[2] = 0;
                  ++s;
                  if (isxdigit((unsigned char)*s)) { t[1] = *s; ++s; }
                  out[n++] = (uint8_t)strtoul(t, NULL, 16);
              }
              return (int)n;
          }

          static int cmd_write(pid_t pid, uint64_t addr, const char *hex) {
              uint8_t buf[512];
              int n;
              if (!open_target(pid)) return 1;
              n = parse_hexbytes(hex, buf, sizeof buf);
              if (n <= 0) { printf("! no bytes in '%s'\n", hex); return 1; }
              if (mem_write(addr, buf, (size_t)n) != n) { printf("! write failed errno=%d\n", errno); return 1; }
              printf("wrote %d bytes at 0x%llx\n", n, (unsigned long long)addr);
              return 0;
          }

          static int cmd_findm(pid_t pid, const char *mod, const char *type, const char *pat) {
              uint8_t pb[MAXPAT], pm[MAXPAT];
              int pn = 0;
              const char *p;
              uint64_t start, end, a;
              uint8_t *buf;
              size_t hits = 0;
              Mod *m;
              if (!open_target(pid)) return 1;
              if (!valid_type(type[0])) die("bad type");
              m = find_mod(mod);
              if (!m) { printf("! module '%s' not found\n", mod); return 1; }
              p = pat;
              while (*p && pn < MAXPAT) {
                  while (*p == ' ') ++p;
                  if (!*p) break;
                  if (*p == '?' || *p == '*') { pb[pn] = 0; pm[pn] = 0; ++pn; ++p; if (*p == '?') ++p; }
                  else if (isxdigit((unsigned char)*p)) {
                      char t[3];
                      t[0] = *p; t[1] = 0; t[2] = 0;
                      ++p;
                      if (isxdigit((unsigned char)*p)) { t[1] = *p; ++p; }
                      pb[pn] = (uint8_t)strtoul(t, NULL, 16); pm[pn] = 1; ++pn;
                  } else ++p;
              }
              if (!pn) { printf("! empty pattern\n"); return 1; }
              start = m->s; end = m->e;
              if (end - start > SCAN_CAP) end = start + SCAN_CAP;
              buf = malloc(CHUNK);
              if (!buf) die("oom");
              for (a = start; a < end; a += CHUNK) {
                  size_t want = (size_t)((end - a) < CHUNK ? (end - a) : CHUNK);
                  ssize_t r = mem_read(a, buf, want);
                  size_t lim, i;
                  if (r <= 0) continue;
                  lim = (size_t)r;
                  for (i = 0; i + (size_t)pn <= lim; ++i) {
                      int ok = 1, k;
                      for (k = 0; k < pn; ++k)
                          if (pm[k] && buf[i + k] != pb[k]) { ok = 0; break; }
                      if (ok) {
                          if (hits < 32) printf("hit %llx\n", (unsigned long long)(a + i));
                          ++hits;
                      }
                  }
              }
              printf("found %zu in %s\n", hits, m->name);
              free(buf);
              return 0;
          }

          static void scan_region(uint64_t s, uint64_t e, char t, double want) {
              size_t ts = tsize(t);
              uint8_t *buf;
              uint64_t a;
              if (e - s > SCAN_CAP) e = s + SCAN_CAP;
              buf = malloc(CHUNK);
              if (!buf) die("oom");
              for (a = s; a < e; a += CHUNK) {
                  size_t want_len = (size_t)((e - a) < CHUNK ? (e - a) : CHUNK);
                  ssize_t r = mem_read(a, buf, want_len);
                  size_t lim, off;
                  if (r <= 0) continue;
                  lim = (size_t)r;
                  for (off = 0; off + ts <= lim; off += ts) {
                      if (g_fn >= MAXF) break;
                      if (eq_value(buf + off, t, want)) g_f[g_fn++] = a + off;
                  }
              }
              free(buf);
          }

          static int cmd_fnew(pid_t pid, const char *mod, char t, const char *v) {
              double want;
              int i;
              if (!open_target(pid)) return 1;
              if (!valid_type(t)) die("bad type");
              g_fn = 0; g_ftype = t; g_fsnapn = 0;
              want = strtod(v, NULL);
              if (!strcmp(mod, "-") || !strcmp(mod, "all") || !strcmp(mod, "heap")) {
                  for (i = 0; i < g_nmaps; ++i) {
                      if (g_maps[i].perms[0] != 'r') continue;
                      if (g_maps[i].name[0]) continue;
                      scan_region(g_maps[i].s, g_maps[i].e, t, want);
                      if (g_fn >= MAXF) break;
                  }
              } else {
                  Mod *m = find_mod(mod);
                  if (!m) { printf("! module '%s' not found\n", mod); return 1; }
                  scan_region(m->s, m->e, t, want);
              }
              printf("RESULT: set %zu candidates type=%c value=%s\n", g_fn, t, v);
              return 0;
          }

          static int cmd_fnext(pid_t pid, char t, const char *v) {
              double want;
              size_t w = 0, ts = tsize(t), i;
              uint8_t b[8];
              if (!open_target(pid)) return 1;
              want = strtod(v, NULL);
              for (i = 0; i < g_fn; ++i) {
                  if (mem_read(g_f[i], b, ts) != (ssize_t)ts) continue;
                  if (eq_value(b, t, want)) g_f[w++] = g_f[i];
              }
              g_fn = w;
              printf("remaining %zu\n", g_fn);
              return 0;
          }

          static int cmd_frange(pid_t pid, char t, const char *lo, const char *hi) {
              double a, b2;
              size_t w = 0, ts = tsize(t), i;
              uint8_t b[8];
              if (!open_target(pid)) return 1;
              a = strtod(lo, NULL); b2 = strtod(hi, NULL);
              for (i = 0; i < g_fn; ++i) {
                  double d;
                  if (mem_read(g_f[i], b, ts) != (ssize_t)ts) continue;
                  d = bytes_to_d(b, t);
                  if (d >= a && d <= b2) g_f[w++] = g_f[i];
              }
              g_fn = w;
              printf("remaining %zu\n", g_fn);
              return 0;
          }

          static int cmd_fshow(pid_t pid, size_t limit) {
              size_t ts, shown = 0, i;
              uint8_t b[8];
              if (!open_target(pid)) return 1;
              if (!limit) limit = 32;
              ts = tsize(g_ftype);
              printf("count %zu\n", g_fn);
              for (i = 0; i < g_fn && shown < limit; ++i) {
                  if (mem_read(g_f[i], b, ts) != (ssize_t)ts) continue;
                  printf("[%zu] 0x%llx = %.6f\n", i, (unsigned long long)g_f[i], bytes_to_d(b, g_ftype));
                  ++shown;
              }
              return 0;
          }

          static int cmd_fset(pid_t pid, size_t idx, char t, const char *v) {
              uint8_t b[8];
              if (!open_target(pid)) return 1;
              if (idx >= g_fn) { printf("! index out of range (%zu)\n", g_fn); return 1; }
              d_to_bytes(strtod(v, NULL), t, b);
              if (mem_write(g_f[idx], b, tsize(t)) <= 0) { printf("! write failed\n"); return 1; }
              printf("wrote [%zu] 0x%llx = %s\n", idx, (unsigned long long)g_f[idx], v);
              return 0;
          }

          static int cmd_fsnap(pid_t pid) {
              size_t ts, i;
              if (!open_target(pid)) return 1;
              ts = tsize(g_ftype);
              g_fsnapn = 0;
              for (i = 0; i < g_fn; ++i)
                  if (mem_read(g_f[i], g_fsnap[i], ts) == (ssize_t)ts) ++g_fsnapn;
              printf("snapshot saved %zu values\n", g_fsnapn);
              return 0;
          }

          static int cmd_frestore(pid_t pid) {
              size_t ts, n = 0, i;
              if (!open_target(pid)) return 1;
              if (!g_fsnapn) { printf("! no snapshot\n"); return 1; }
              ts = tsize(g_ftype);
              for (i = 0; i < g_fsnapn && i < g_fn; ++i)
                  if (mem_write(g_f[i], g_fsnap[i], ts) > 0) ++n;
              printf("restored %zu values\n", n);
              return 0;
          }

          static double norm_deg(double d) {
              while (d > 180.0) d -= 360.0;
              while (d < -180.0) d += 360.0;
              return d;
          }

          static void slerp_quat(float *cur, const float *tgt, float s) {
              float d = cur[0]*tgt[0] + cur[1]*tgt[1] + cur[2]*tgt[2] + cur[3]*tgt[3];
              float t[4];
              int i;
              t[0] = tgt[0]; t[1] = tgt[1]; t[2] = tgt[2]; t[3] = tgt[3];
              if (d < 0.0f) { d = -d; for (i = 0; i < 4; ++i) t[i] = -t[i]; }
              if (d > 0.9995f) { for (i = 0; i < 4; ++i) cur[i] += (t[i] - cur[i]) * s; }
              else {
                  float th = acosf(d), sn = sinf(th);
                  float a = sinf((1.0f - s) * th) / sn, b = sinf(s * th) / sn;
                  for (i = 0; i < 4; ++i) cur[i] = cur[i] * a + t[i] * b;
              }
              {
                  float n = sqrtf(cur[0]*cur[0]+cur[1]*cur[1]+cur[2]*cur[2]+cur[3]*cur[3]);
                  if (n > 0.0f) for (i = 0; i < 4; ++i) cur[i] /= n;
              }
          }

          static void look_quat(float dx, float dy, float dz, float up_y, float *out) {
              float fx = dx, fy = dy, fz = dz;
              float fn = sqrtf(fx*fx + fy*fy + fz*fz);
              float ux, uy, uz, rx, ry, rz, rn, vx, vy, vz;
              float m00, m01, m02, m10, m11, m12, m20, m21, m22;
              float tr, qw, qx, qy, qz, s;
              if (fn <= 0) return;
              fx /= fn; fy /= fn; fz /= fn;
              ux = 0; uy = up_y; uz = (up_y == 1.0f) ? 0.0f : 1.0f;
              rx = uy*fz - uz*fy; ry = uz*fx - ux*fz; rz = ux*fy - uy*fx;
              rn = sqrtf(rx*rx + ry*ry + rz*rz);
              if (rn < 1e-6f) {
                  ux = 0; uy = 0; uz = 1;
                  rx = uy*fz - uz*fy; ry = uz*fx - ux*fz; rz = ux*fy - uy*fx;
                  rn = sqrtf(rx*rx + ry*ry + rz*rz);
              }
              rx /= rn; ry /= rn; rz /= rn;
              vx = fy*rz - fz*ry; vy = fz*rx - fx*rz; vz = fx*ry - fy*rx;
              m00 = rx; m01 = vx; m02 = fx;
              m10 = ry; m11 = vy; m12 = fy;
              m20 = rz; m21 = vz; m22 = fz;
              tr = m00 + m11 + m22;
              if (tr > 0.0f) {
                  s = sqrtf(tr + 1.0f) * 2.0f;
                  qw = 0.25f*s; qx = (m21-m12)/s; qy = (m02-m20)/s; qz = (m10-m01)/s;
              } else if (m00 > m11 && m00 > m22) {
                  s = sqrtf(1.0f+m00-m11-m22)*2.0f;
                  qw = (m21-m12)/s; qx = 0.25f*s; qy = (m01+m10)/s; qz = (m02+m20)/s;
              } else if (m11 > m22) {
                  s = sqrtf(1.0f+m11-m00-m22)*2.0f;
                  qw = (m02-m20)/s; qx = (m01+m10)/s; qy = 0.25f*s; qz = (m12+m21)/s;
              } else {
                  s = sqrtf(1.0f+m22-m00-m11)*2.0f;
                  qw = (m10-m01)/s; qx = (m02+m20)/s; qy = (m12+m21)/s; qz = 0.25f*s;
              }
              out[0] = qx; out[1] = qy; out[2] = qz; out[3] = qw;
          }

          static int cmd_aim(pid_t pid, uint64_t cam, uint64_t me, uint64_t arr,
                             int count, int stride, uint64_t posoff,
                             float smooth, float fov, char mode, int flags) {
              struct timespec ts;
              uint64_t ticks = 0;
              int last = -1, zup;
              float lastd = -1;
              signal(SIGPIPE, SIG_IGN);
              setvbuf(stdout, NULL, _IOLBF, 0);
              if (!open_target(pid)) return 1;
              if (stride != 4 && stride != 8) stride = g_ptr;
              if (count <= 0) count = 64;
              if (smooth < 0) smooth = 0;
              if (smooth > 1) smooth = 1;
              ts.tv_sec = 0; ts.tv_nsec = 8 * 1000 * 1000;
              zup = (flags & 8) != 0;
              printf("aim start pid=%d cam=0x%llx me=0x%llx arr=0x%llx count=%d stride=%d "
                     "posoff=0x%llx smooth=%.2f fov=%.1f mode=%c flags=%d\n",
                     pid, (unsigned long long)cam, (unsigned long long)me,
                     (unsigned long long)arr, count, stride, (unsigned long long)posoff,
                     smooth, fov, mode, flags);
              for (;;) {
                  float mx = 0, my = 0, mz = 0;
                  int best = -1, i;
                  float bestd = 1e18f, bx = 0, by = 0, bz = 0;
                  ++ticks;
                  if (me) read_vec3(me + posoff, &mx, &my, &mz);
                  for (i = 0; i < count; ++i) {
                      uint64_t e = 0;
                      float ex, ey, ez, dx, dy, dz, d;
                      if (arr) {
                          if (!read_ptr(arr + (uint64_t)i * (uint64_t)stride, &e) || !e) continue;
                      } else {
                          if (i == 0) { e = me; if (!e) continue; } else continue;
                      }
                      if (!read_vec3(e + posoff, &ex, &ey, &ez)) continue;
                      dx = ex - mx; dy = ey - my; dz = ez - mz;
                      d = sqrtf(dx*dx + dy*dy + dz*dz);
                      if (d < 0.15f) continue;
                      if (fov > 0.0f && d > fov) continue;
                      if (d < bestd) { bestd = d; best = i; bx = ex; by = ey; bz = ez; }
                  }
                  if (best >= 0) {
                      float dx = bx - mx, dy = by - my, dz = bz - mz;
                      if (mode == 'q') {
                          float cur[4];
                          if (mem_read(cam, cur, 16) == 16) {
                              float tgt[4];
                              look_quat(dx, dy, dz, zup ? 0.0f : 1.0f, tgt);
                              if (flags & 4) tgt[1] = -tgt[1];
                              slerp_quat(cur, tgt, smooth >= 0.99f ? 1.0f : smooth);
                              mem_write(cam, cur, 16);
                          }
                      } else {
                          double yaw, pitch, k;
                          float cur[2];
                          if (zup) {
                              yaw = atan2(dy, dx) * RAD2DEG;
                              pitch = -atan2(dz, sqrt(dx*dx + dy*dy)) * RAD2DEG;
                          } else {
                              yaw = atan2(dx, dz) * RAD2DEG;
                              pitch = -asin(dy / sqrtf(dx*dx + dy*dy + dz*dz)) * RAD2DEG;
                          }
                          if (mem_read(cam, cur, 8) == 8) {
                              double ny, np;
                              int do_write = 1;
                              k = (smooth >= 0.99f) ? 1.0 : smooth;
                              ny = cur[0] + norm_deg(yaw - cur[0]) * k;
                              np = cur[1] + norm_deg(pitch - cur[1]) * k;
                              if (flags & 4) np = -np;
                              if (flags & 1) do_write = fabs(norm_deg(yaw - cur[0])) > 1.0;
                              if (do_write) {
                                  float o2[2];
                                  o2[0] = (float)ny; o2[1] = (float)np;
                                  if (!(flags & 2)) o2[1] = cur[1];
                                  mem_write(cam, o2, 8);
                              }
                          }
                      }
                      last = best; lastd = bestd;
                  }
                  if ((ticks % 125) == 0)
                      printf("t=%llu target=%d dist=%.1f mode=%c\n",
                             (unsigned long long)ticks, last, lastd, mode);
                  nanosleep(&ts, NULL);
              }
              return 0;
          }

          int main(int argc, char **argv) {
              const char *c;
              pid_t pid;
              if (argc < 2) return cmd_help();
              c = argv[1];
              if (!strcmp(c, "help") || !strcmp(c, "-h") || !strcmp(c, "--help")) return cmd_help();
              if (!strcmp(c, "version")) { printf("vnxmem %s\n", VERSION); return 0; }
              if (!strcmp(c, "freset")) { g_fn = 0; g_fsnapn = 0; printf("cleared\n"); return 0; }
              if (argc < 3) { fprintf(stderr, "! need pid\n"); return 1; }
              pid = (pid_t)strtol(argv[2], NULL, 10);
              if (pid <= 0) { fprintf(stderr, "! bad pid\n"); return 1; }

              if (!strcmp(c, "probe"))     return cmd_probe(pid);
              if (!strcmp(c, "tracerpid")) return cmd_tracerpid(pid);
              if (!strcmp(c, "mods"))      return cmd_mods(pid);
              if (!strcmp(c, "attach"))    { printf("no attach needed\n"); return 0; }
              if (!strcmp(c, "detach"))    { printf("detached\n"); return 0; }
              if (!strcmp(c, "read")) {
                  if (argc < 5) die("read needs addr len");
                  return cmd_read(pid, strtoull(argv[3], NULL, 0), (size_t)strtoull(argv[4], NULL, 0));
              }
              if (!strcmp(c, "write")) {
                  if (argc < 5) die("write needs addr hex");
                  return cmd_write(pid, strtoull(argv[3], NULL, 0), argv[4]);
              }
              if (!strcmp(c, "findm")) {
                  if (argc < 6) die("findm needs module type pattern");
                  return cmd_findm(pid, argv[3], argv[4], argv[5]);
              }
              if (!strcmp(c, "fnew")) {
                  if (argc < 6) die("fnew needs module type value");
                  return cmd_fnew(pid, argv[3], argv[4][0], argv[5]);
              }
              if (!strcmp(c, "fnext")) {
                  if (argc < 5) die("fnext needs type value");
                  return cmd_fnext(pid, argv[3][0], argv[4]);
              }
              if (!strcmp(c, "frange")) {
                  if (argc < 6) die("frange needs type lo hi");
                  return cmd_frange(pid, argv[3][0], argv[4], argv[5]);
              }
              if (!strcmp(c, "fshow")) return cmd_fshow(pid, argc >= 4 ? (size_t)strtoul(argv[3], NULL, 10) : 32);
              if (!strcmp(c, "fset")) {
                  if (argc < 6) die("fset needs index type value");
                  return cmd_fset(pid, (size_t)strtoul(argv[3], NULL, 10), argv[4][0], argv[5]);
              }
              if (!strcmp(c, "fsnap"))    return cmd_fsnap(pid);
              if (!strcmp(c, "frestore")) return cmd_frestore(pid);
              if (!strcmp(c, "aim")) {
                  if (argc < 12) die("aim needs 9 args");
                  return cmd_aim(pid,
                      strtoull(argv[3], NULL, 0), strtoull(argv[4], NULL, 0),
                      strtoull(argv[5], NULL, 0), atoi(argv[6]), atoi(argv[7]),
                      strtoull(argv[8], NULL, 0), strtof(argv[9], NULL),
                      strtof(argv[10], NULL), argv[11][0],
                      argc >= 13 ? atoi(argv[12]) : 0);
              }
              fprintf(stderr, "! unknown command '%s'\n", c);
              cmd_help();
              return 1;
          }
          VNXC

          echo "--- files written ---"
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml app/src/main/cpp/vnxmem.c \
                   app/src/main/java/ai/venice/vnx/MainActivity.kt; do
            if [ -s "$f" ]; then echo "OK   $f ($(wc -c <"$f") bytes)"; else echo "MISS $f"; exit 1; fi
          done

      - name: build
        run: |
          set -euo pipefail
          echo "--- host C check ---"
          gcc -O2 -Wall -o /tmp/vnxmem_host app/src/main/cpp/vnxmem.c -lm
          /tmp/vnxmem_host help

          echo "--- native 4 abi ---"
          NDKROOT=""
          for d in "$ANDROID_HOME"/ndk/*; do
            if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then NDKROOT="$d"; fi
          done
          [ -n "$NDKROOT" ] || NDKROOT="$ANDROID_HOME/ndk/${NDK_VERSION}"
          TC="$NDKROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$TC/clang" ] || { echo "::error::no clang at $TC"; ls "$ANDROID_HOME/ndk"; exit 1; }
          [ -x "$TC/llvm-strip" ] || { echo "::error::no llvm-strip"; exit 1; }

          bld() {
            "$TC/${2}24-clang" -O2 -static -fPIE -pie -ffunction-sections \
              -fdata-sections -Wl,--gc-sections -Wall \
              -o "app/src/main/assets/vnxmem-$1" app/src/main/cpp/vnxmem.c -lm
            "$TC/llvm-strip" "app/src/main/assets/vnxmem-$1"
            echo "built $1 -> $(stat -c%s "app/src/main/assets/vnxmem-$1") bytes"
          }
          bld arm64-v8a   aarch64-linux-android
          bld armeabi-v7a armv7a-linux-androideabi
          bld x86_64      x86_64-linux-android
          bld x86         i686-linux-android
          for a in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/src/main/assets/vnxmem-$a" || { echo "::error::missing $a"; exit 1; }
          done

          echo "--- gradle ---"
          gradle --no-daemon --console=plain assembleDebug assembleRelease

          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/$APK_NAME"
          cp app/build/outputs/apk/debug/*.apk   "out/VNX-Apex-debug.apk"
          ls -la out/

      - name: logs-on-fail
        if: failure()
        run: |
          echo "=== last 60 lines of gradle ==="
          tail -n 60 app/build/reports 2>/dev/null || true

      - name: upload-apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnx-apex-apk
          path: out/*.apk
          if-no-files-found: warn

      - name: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: VNX Apex v1.8.${{ github.run_number }}
          files: out/*.apk
          fail_on_unmatched_files: true
